#################### default parameters ############################
# favicon module: https://github.com/gethugothemes/hugo-modules/tree/master/images#favicon-implementation
favicon = "images/favicon.png"
# logo module: https://github.com/gethugothemes/hugo-modules/tree/master/images#logo-implementation
logo = "logo.svg"
logo_darkmode = "logo.svg"
# use `px` or `x` with logo_width, example: "100px".
# Note: logo_width is not work with .svg file
logo_width = "160px"
logo_height = "32px"
# if logo_webp set false, will not generate WEBP version of logo | default is true
logo_webp = true
# logo text will only show when logo is missing.
logo_text = "Computerhacking101"
# navbar fixed to top
navbar_fixed = true
# theme-mode
theme_switcher = false
theme_default = "dark" # available options [light/dark/system]
# Main Sections
mainSections = ["blog", "tutorials"]
# contact form action
contact_form_action = "#" # contact form works with [https://airform.io/] or [https://formspree.io]
# google tag manager, see https://developers.google.com/tag-manager/
google_tag_manager = "" # example: G-XXXXXXXXXX
google_adsense = ""     # example: ca-pub-xxxxxxxxxxxxxxxx
# custom script on header, example: custom_script= "<script>console.log(\"Hello World\")</script>"
custom_script = ""
# copyright
copyright = "Designed & Developed by [TechNestCreations](https://technestcreations.com)"

# Preloader
# preloader module: https://github.com/gethugothemes/hugo-modules/tree/master/components/preloader
[preloader]
enable = false
preloader = "" # use jpg, png, svg or gif format.

# Navigation button
[navigation_button]
enable = false
label = "get a quote"
link = "contact"

# search
# search module: https://github.com/gethugothemes/hugo-modules/tree/master/search
[search]
enable = true
primary_color = "#121212"
include_sections = ["blog", "tutorials"]
show_image = true
show_description = true
show_tags = true
show_categories = true

# announcement
# announcement module: https://github.com/gethugothemes/hugo-modules/tree/master/components/announcement
[announcement]
enable = false
expire_days = 7
content = "You must replace the **baseURL** in **hugo.toml** file when deploying, you can manage this announcement from the **params.toml** file."

[metadata]  # used by gethugothemes/seo-tools › basic-seo
title       = "Computer Hacking 101 – Hands-On Guides for Docker, Linux & Smart-Home DIY"
description = "Step-by-step tutorials that help you ‘hack’ your own tech: Docker containers, Git workflow, Linux servers, Syncthing sync, and home-automation projects."
keywords    = [
  "Computer Hacking 101",
  "docker tutorials",
  "linux server setup",
  "git version control guide",
  "syncthing file sync",
  "home automation how-to",
  "smart home hardware",
  "ubuntu hardening",
  "digitalocean droplet setup",
  "tech DIY guides"
]
author      = "Computer Hacking 101"
twitter     = "@YourHandle"  # replace with real profile
image       = "images/ch101-og.png"  # 1200×630, ≤300 KB, descriptive file name

# — Open Graph (Facebook, LinkedIn, Slack, Discord…) —
[opengraph]
og_type        = "website"
og_title       = "Computer Hacking 101 – Hands-On Guides for Docker, Linux & Smart-Home DIY"
og_description = "Learn to ‘hack’ your own hardware & software. From containerizing apps with Docker to building a secure Ubuntu server or automating your home, CH101 has you covered."
og_url         = "https://computerhacking101.com/"     # canonical URL
og_image       = "images/ch101-og.png"
og_site_name   = "Computer Hacking 101"

# — Twitter Card (X) —
[twitter_card]
card                = "summary_large_image"
twitter_title       = "Computer Hacking 101 – Practical Tech Tutorials & DIY Hacks"
twitter_description = "Docker, Git, Linux, Syncthing, smart-home automation—master them all with easy, actionable guides."
twitter_image       = "images/ch101-og.png"
twitter_site        = "@YourHandle"     # org / site-wide
twitter_creator     = "@AuthorHandle"   # optional: individual author


# site verifications
# verification module: https://github.com/gethugothemes/hugo-modules/tree/master/seo-tools/site-verifications
[site_verification]
google = ""   # Your verification code
bing = ""     # Your verification code
baidu = ""    # Your verification code
facebook = "" # Your verification code
mastodon = "" # Your verification code

# cookies
# cookies module: https://github.com/gethugothemes/hugo-modules/tree/master/components/cookie-consent
[cookies]
enable = false
expire_days = 60
content = "This site uses cookies. By continuing to use this website, you agree to their use."
button = "I Accept"

# diagrams
[mermaid]
js_url = 'https://cdn.jsdelivr.net/npm/mermaid@latest/dist/mermaid.esm.min.mjs'

######################## sidebar widgets #########################
[widgets]
sidebar = ["categories", "tags"]





