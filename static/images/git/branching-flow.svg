<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="320" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .axis { stroke: #94a3b8; stroke-width: 2; }
      .main { stroke: #38bdf8; stroke-width: 4; fill: none; }
      .feature { stroke: #22c55e; stroke-width: 4; fill: none; }
      .commit { fill: #e2e8f0; stroke: #64748b; }
      .label { fill: #e5e7eb; font: 14px sans-serif; }
      .caption { fill: #9ca3af; font: 12px sans-serif; }
    </style>
  </defs>

  <text x="20" y="24" class="label">Branching & Merging Flow</text>
  <text x="20" y="42" class="caption">Create feature branch, keep it updated from main, merge back via PR (FF or merge commit).</text>

  <!-- timeline axis -->
  <line x1="60" y1="160" x2="740" y2="160" class="axis"/>

  <!-- main line -->
  <path d="M80,160 L260,160 L260,160 L500,160 L700,160" class="main"/>

  <!-- feature branch diverge -->
  <path d="M260,160 C300,160 300,100 340,100 L500,100" class="feature"/>

  <!-- fast-forward merge back to main -->
  <path d="M500,100 C540,100 540,160 580,160" class="feature"/>

  <!-- commits on main -->
  <circle cx="120" cy="160" r="7" class="commit"/>
  <circle cx="200" cy="160" r="7" class="commit"/>
  <circle cx="260" cy="160" r="7" class="commit"/>
  <circle cx="420" cy="160" r="7" class="commit"/>
  <circle cx="580" cy="160" r="7" class="commit"/>

  <!-- commits on feature -->
  <circle cx="360" cy="100" r="7" class="commit"/>
  <circle cx="440" cy="100" r="7" class="commit"/>
  <circle cx="500" cy="100" r="7" class="commit"/>

  <!-- labels -->
  <text x="70" y="190" class="label">main</text>
  <text x="342" y="86" class="label">feature/login</text>

  <!-- legend -->
  <rect x="60" y="240" width="12" height="4" fill="#38bdf8"/>
  <text x="80" y="248" class="caption">main</text>
  <rect x="140" y="238" width="12" height="4" fill="#22c55e"/>
  <text x="160" y="248" class="caption">feature</text>
</svg>
