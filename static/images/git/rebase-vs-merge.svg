<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="380" viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .axis { stroke: #94a3b8; stroke-width: 2; }
      .main { stroke: #38bdf8; stroke-width: 4; fill: none; }
      .feature { stroke: #22c55e; stroke-width: 4; fill: none; }
      .commit { fill: #e2e8f0; stroke: #64748b; }
      .label { fill: #e5e7eb; font: 14px sans-serif; }
      .caption { fill: #9ca3af; font: 12px sans-serif; }
      .divider { stroke: #334155; stroke-width: 1; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <text x="20" y="24" class="label">Rebase vs Merge</text>
  <text x="20" y="42" class="caption">Left: Merge preserves branch structure. Right: Rebase creates a linear history.</text>

  <!-- Divider -->
  <line x1="400" y1="60" x2="400" y2="340" class="divider"/>

  <!-- MERGE (left) -->
  <text x="60" y="70" class="label">Merge</text>
  <line x1="60" y1="160" x2="360" y2="160" class="axis"/>
  <path d="M80,160 L170,160 L260,160 L340,160" class="main"/>
  <path d="M170,160 C200,160 200,110 230,110 L320,110" class="feature"/>
  <circle cx="110" cy="160" r="7" class="commit"/>
  <circle cx="170" cy="160" r="7" class="commit"/>
  <circle cx="230" cy="110" r="7" class="commit"/>
  <circle cx="280" cy="110" r="7" class="commit"/>
  <circle cx="320" cy="110" r="7" class="commit"/>
  <!-- merge commit -->
  <circle cx="320" cy="160" r="9" fill="#fca5a5" stroke="#b91c1c"/>
  <text x="86" y="190" class="caption">main</text>
  <text x="232" y="96" class="caption">feature</text>

  <!-- REBASE (right) -->
  <text x="460" y="70" class="label">Rebase</text>
  <line x1="440" y1="160" x2="740" y2="160" class="axis"/>
  <path d="M460,160 L550,160 L640,160 L720,160" class="main"/>
  <!-- feature commits replayed on top of main -->
  <circle cx="580" cy="130" r="7" class="commit"/>
  <circle cx="610" cy="120" r="7" class="commit"/>
  <!-- arrows indicating replay -->
  <path d="M580,130 C580,145 580,150 580,160" stroke="#22c55e" stroke-width="2" fill="none"/>
  <polygon points="576,156 584,156 580,164" fill="#22c55e"/>
  <path d="M610,120 C610,140 610,150 610,160" stroke="#22c55e" stroke-width="2" fill="none"/>
  <polygon points="606,156 614,156 610,164" fill="#22c55e"/>
  <!-- resulting linear commits on main after rebase -->
  <circle cx="520" cy="160" r="7" class="commit"/>
  <circle cx="580" cy="160" r="7" class="commit"/>
  <circle cx="610" cy="160" r="7" class="commit"/>
  <circle cx="670" cy="160" r="7" class="commit"/>
  <text x="466" y="190" class="caption">main (after rebase)</text>
</svg>
