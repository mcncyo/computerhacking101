######################## default configuration ####################
# The base URL of your site (required). This will be prepended to all relative URLs.
baseURL = "https://computerhacking101.com/"
# Ensure canonical URLs are used
canonifyURLs = true
# Enable relative URLs (useful for local development)
relativeURLs = false
# Set the language code for the HTML element
languageCode = "en-us"
# Enable multilingual mode if needed
hasCJKLanguage = false
# Title of your website (required).
title = "Computer Hacking 101"
# Site description for SEO
description = "Learn ethical hacking, cybersecurity, and IT skills with step-by-step tutorials and guides."
# Your theme name
theme = "hugoplate"
# Default time zone for time stamps
timeZone = "America/Chicago"
# Post excerpt length
summaryLength = 30
# Enable sitemap generation
enableRobotsTXT = true
# Disable languages (for multilingual sites)
disableLanguages = []
# Default language
defaultContentLanguage = 'en'
# Language in subdirectory
defaultContentLanguageInSubdir = false

# PWA Configuration
[params.pwa]
  enable = true
  manifest = "/site.webmanifest"
  themeColor = "#4fc3f7"
  backgroundColor = "#ffffff"
  display = "standalone"
  scope = "/"
  startURL = "/?source=pwa"
  icon = "android-chrome-192x192.png"
  icon_192 = "android-chrome-192x192.png"
  icon_512 = "android-chrome-512x512.png"
  apple_touch_icon = "apple-touch-icon.png"
  safari_pinned_tab = "safari-pinned-tab.svg"
  msapplication_config = "/browserconfig.xml"
  msapplication_TileColor = "#4fc3f7"

# SEO Configuration
[params.seo]
  google_analytics_id = ""  # Add your Google Analytics ID
  google_site_verification = ""  # Add Google Search Console verification code
  bing_verification = ""  # Add Bing Webmaster Tools verification code
  yandex_verification = ""  # Add Yandex Webmaster verification code
  baidu_verification = ""  # Add Baidu Webmaster Tools verification code
  twitter_site = "@computerhack101"  # Your Twitter handle
  twitter_creator = "@computerhack101"  # Your Twitter handle
  
# Performance optimizations
[params.performance]
  minify = true
  minifyJS = true
  minifyCSS = true
  minifyHTML = true
  minifyJSON = true
  minifyXML = true
  bundle = true
  bundleCSS = true
  bundleJS = true
  inlineCSS = true
  inlineJS = true
  preloadCriticalCSS = true
  preloadFonts = true
  preloadImages = true
  preloadVideos = true
  preloadIframes = true
  preloadScripts = true
  preloadStyles = true
  preconnect = ["https://fonts.googleapis.com", "https://fonts.gstatic.com"]
  dns_prefetch = ["//www.google-analytics.com", "//cdnjs.cloudflare.com"]
  preload = ["/css/critical.css", "/fonts/your-font.woff2"]

########################### Services #############################
[services]

[services.disqus]
shortname = 'themefisher-template' # we use disqus to show comments in blog posts . To install disqus please follow this tutorial https://portfolio.peter-baumgartner.net/2017/09/10/how-to-install-disqus-on-hugo/

########################## Permalinks ############################
[permalinks]
pages = "/:slug/"


########################## Pagination ############################
[pagination]
disableAliases = false
pagerSize = 10
path = 'page'


############################# Build ##############################
[build]
[build.buildStats]
enable = true
[[build.cachebusters]]
source = 'assets/notwatching/hugo_stats\.json'
target = 'css'

############################# Modules ############################
[module]
[[module.mounts]]
source = 'assets'
target = 'assets'
[[module.mounts]]
disableWatch = true
source = 'hugo_stats.json'
target = 'assets/notwatching/hugo_stats.json'


############################# Outputs ############################
[outputs]
home = ["HTML", "RSS", "WebAppManifest", "SearchIndex", "Sitemap", "SitemapPages", "SitemapPosts"]
page = ["HTML"]
section = ["HTML", "RSS"]

############################# Imaging ############################
[imaging]
# See https://github.com/disintegration/imaging
# Default JPEG or WebP quality setting. Default is 75.
quality = 80
resampleFilter = "Lanczos"

############################ Caches ##############################
[caches]
[caches.images]
dir = ":resourceDir/_gen"
maxAge = "720h"

[caches.assets]
dir = ":resourceDir/_gen"
maxAge = "720h"


############################ Markup ##############################
[markup]
[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions]     # <-- add this table
attribute = true               # so {.btn-red} works

[taxonomies]
tag = "tags"
category = "categories"


[markup.highlight]
style = 'monokai' # see https://xyproto.github.io/splash/docs/all.html
lineNumbersInTable = false

[markup.tableOfContents]
startLevel = 2
endLevel = 5
ordered = true




########################### Media types ###########################
[mediaTypes]
[mediaTypes."application/manifest+json"]
suffixes = ["webmanifest"]


########################### Output Format ##########################
[outputFormats]
[outputFormats.WebAppManifest]
mediaType = "application/manifest+json"
rel = "manifest"

[outputFormats.SearchIndex]
mediaType = "application/json"
baseName = "searchindex"
isPlainText = true
notAlternative = true

[outputFormats.SitemapPages]
mediaType = "application/xml"
baseName = "sitemap-pages"
isPlainText = true
notAlternative = true

[outputFormats.SitemapPosts]
mediaType = "application/xml"
baseName = "sitemap-posts"
isPlainText = true
notAlternative = true


############################# Plugins ##############################

# CSS Plugins
[[params.plugins.css]]
link = "plugins/swiper/swiper-bundle.css"
lazy = true
[[params.plugins.css]]
link = "plugins/glightbox/glightbox.css"
lazy = true
[[params.plugins.css]]
link = "plugins/font-awesome/v6/brands.css"
lazy = true
[[params.plugins.css]]
link = "plugins/font-awesome/v6/solid.css"
lazy = true
[[params.plugins.css]]
link = "plugins/font-awesome/v6/icons.css"
lazy = true

# JS Plugins
[[params.plugins.js]]
link = "js/search.js"
lazy = false
[[params.plugins.js]]
link = "plugins/swiper/swiper-bundle.js"
lazy = false
[[params.plugins.js]]
link = "plugins/cookie.js"
lazy = false
[[params.plugins.js]]
link = "plugins/glightbox/glightbox.js"
lazy = true
[[params.plugins.js]]
link = "js/gallery-slider.js"
lazy = true
[[params.plugins.js]]
link = "js/accordion.js"
lazy = true
[[params.plugins.js]]
link = "js/tab.js"
lazy = true
[[params.plugins.js]]
link = "js/modal.js"
lazy = true
[[params.plugins.js]]
link = "plugins/youtube-lite.js"
lazy = true

[security.exec]
  allow = ["^(dart-)?sass(-embedded)?$", "^go$", "^git$", "^npx$", "^postcss$", "^tailwindcss$", "^node$"]
