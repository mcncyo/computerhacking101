baseURL = "https://computerhacking101.com/"
canonifyURLs = true
relativeURLs = false
languageCode = "en-us"
title = "Computer Hacking 101"
timeZone = "America/Chicago"
summaryLength = 30
enableRobotsTXT = true
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[module]
  [module.hugoVersion]
    extended = true
    min = "0.141.0"
  [[module.imports]]
    path = "github.com/imfing/hextra"

[permalinks]
  pages = "/:slug/"

[taxonomies]
  tag = "tags"
  category = "categories"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions]
    attribute = true
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[outputs]
  home = ["HTML", "RSS", "Sitemap", "SitemapPages", "SitemapPosts"]
  page = ["HTML"]
  section = ["HTML", "RSS"]

[outputFormats]
  [outputFormats.SitemapPages]
    mediaType = "application/xml"
    baseName = "sitemap-pages"
    isPlainText = true
    notAlternative = true
  [outputFormats.SitemapPosts]
    mediaType = "application/xml"
    baseName = "sitemap-posts"
    isPlainText = true
    notAlternative = true

[menu]
  [[menu.main]]
    name = "Tutorials"
    pageRef = "/tutorials"
    weight = 1
  [[menu.main]]
    name = "Blog"
    pageRef = "/blog"
    weight = 2
  [[menu.main]]
    name = "About"
    pageRef = "/about"
    weight = 3
  [[menu.main]]
    name = "Search"
    weight = 4
    [menu.main.params]
      type = "search"
  [[menu.main]]
    name = "Theme"
    weight = 5
    [menu.main.params]
      type = "theme-toggle"

[params]
  images = ["images/og-default.png"]
  description = "Step-by-step tutorials that help you make your computer work for you: Docker, Linux servers, Home Assistant, security and self-hosting."
  [params.navbar]
    displayTitle = true
    displayLogo = false
  [params.footer]
    displayCopyright = false
    displayPoweredBy = false
  [params.search]
    enable = true
    type = "flexsearch"
  [params.theme]
    default = "dark"
    displayToggle = true

[security]
  [security.exec]
    allow = ["^go$", "^git$", "^npx$", "^node$"]
