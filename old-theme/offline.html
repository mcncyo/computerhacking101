<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - {{ .Site.Title }}</title>
  <style>
    :root {
      --primary: #4fc3f7;
      --primary-dark: #0093c4;
      --bg: #f8fafc;
      --text: #1e293b;
      --text-light: #64748b;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      line-height: 1.6;
      color: var(--text);
      background-color: var(--bg);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    
    h1 {
      color: var(--primary);
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
    }
    
    p {
      color: var(--text-light);
      font-size: 1.25rem;
      margin-bottom: 2rem;
    }
    
    .btn {
      display: inline-block;
      background-color: var(--primary);
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 0.375rem;
      text-decoration: none;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    
    .btn:hover {
      background-color: var(--primary-dark);
    }
    
    .offline-icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      color: var(--primary);
    }
    
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --text: #f8fafc;
        --text-light: #94a3b8;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="offline-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" viewBox="0 0 16 16">
        <path d="M13.5 8a6.5 6.5 0 0 0-1.1-3.6l-1.2 1.2a5.5 5.5 0 0 1 0 4.8l1.2 1.2A6.5 6.5 0 0 0 13.5 8z"/>
        <path d="M11.3 6.2a4.5 4.5 0 0 1 0 3.6l-1.1 1.1a3.5 3.5 0 0 0 0-5.8l1.1 1.1z"/>
        <path d="M9.2 8a2.5 2.5 0 0 0-.4-1.3L7.6 8l1.2 1.2a2.5 2.5 0 0 0 .4-1.2z"/>
        <path d="M8 1a7 7 0 0 0-7 7 1 1 0 1 0 2 0 5 5 0 0 1 5-5 1 1 0 1 0 0-2z"/>
        <path d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8 7a7 7 0 0 0 7-7 1 1 0 1 0-2 0 5 5 0 0 1-5 5 1 1 0 1 0 0 2z"/>
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>It seems you're not connected to the internet. Don't worry, you can still access previously viewed content.</p>
    <a href="/" class="btn">Go to Homepage</a>
  </div>
  
  <script>
    // Try to reload the page when back online
    window.addEventListener('online', () => {
      window.location.reload();
    });
    
    // Check if we're back online periodically
    setInterval(() => {
      if (navigator.onLine) {
        window.location.reload();
      }
    }, 5000);
  </script>
</body>
</html>
