{{- $lang := .Type | default "text" -}}
{{- $code := .Inner | safeHTML -}}

<div class="code-block">
  <button class="copy-button" title="Copy to clipboard" data-clipboard-target="#code-{{ .Ordinal }}">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
    </svg>
  </button>
  <pre><code id="code-{{ .Ordinal }}" class="language-{{ $lang }}">{{ $code }}</code></pre>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.copy-button').forEach(button => {
    button.addEventListener('click', async (e) => {
      e.preventDefault();
      const codeId = button.getAttribute('data-clipboard-target').substring(1);
      const codeElement = document.getElementById(codeId);
      const code = codeElement.textContent;
      
      try {
        await navigator.clipboard.writeText(code);
        
        // Show success feedback
        const originalHTML = button.innerHTML;
        button.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
        `;
        button.classList.add('copied');
        
        // Revert after 2 seconds
        setTimeout(() => {
          button.innerHTML = originalHTML;
          button.classList.remove('copied');
        }, 2000);
        
      } catch (err) {
        console.error('Failed to copy:', err);
        button.textContent = 'Failed to copy';
        setTimeout(() => { button.innerHTML = originalHTML; }, 2000);
      }
    });
  });
});
</script>
