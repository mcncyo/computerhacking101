<!-- Search Modal -->
<div class="search-modal fixed left-0 top-0 z-[999] hidden h-full w-full overflow-y-auto overflow-x-hidden bg-black/60 backdrop-blur-sm" id="search-modal">
  <div class="relative mx-auto max-w-3xl p-4 opacity-0 transition-opacity duration-300" id="search-container">
    <!-- Close button -->
    <button type="button" class="absolute right-4 top-4 text-2xl text-white hover:text-primary" id="search-close">
      <i class="fa-solid fa-xmark"></i>
    </button>
    
    <!-- Search form -->
    <div class="relative">
      <input 
        type="search" 
        id="search-input" 
        class="w-full rounded-lg border-0 bg-white/90 px-5 py-4 pl-12 pr-10 text-lg text-gray-900 shadow-lg focus:ring-2 focus:ring-primary/50 dark:bg-gray-900/90 dark:text-white" 
        placeholder="Search tutorials, guides, and more..."
        autocomplete="off"
        aria-label="Search"
      >
      <div class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
        <i class="fa-solid fa-search text-xl"></i>
      </div>
      <button type="button" id="search-clear" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hidden">
        <i class="fa-solid fa-times-circle"></i>
      </button>
    </div>
    
    <!-- Search results container -->
    <div id="search-results" class="mt-2 max-h-[60vh] overflow-y-auto rounded-lg bg-white p-4 shadow-lg dark:bg-gray-900">
      <div id="search-status" class="p-4 text-center text-gray-500">
        <p>Type to search...</p>
      </div>
      <div id="search-hits" class="space-y-4"></div>
    </div>
  </div>
</div>

<!-- Search script -->
{{ $searchJS := resources.Get "js/search.js" | js.Build (dict "minify" true) | fingerprint }}
<script src="{{ $searchJS.RelPermalink }}" defer></script>

<!-- Fuse.js for client-side search -->
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<!-- Search styles -->
{{ $searchCSS := resources.Get "css/search.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $searchCSS.RelPermalink }}" media="screen">
