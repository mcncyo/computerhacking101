{{ define "main" }}
  {{ partial "page-header" . }}

  <!-- Intro copy from _index.md -->
  {{ if eq .RelPermalink "/tutorials/" }}
    <!-- Keep tutorials landing page as-is (narrow) -->
    <section class="container prose md:prose-lg mx-auto py-10">
      {{ .Content }}
    </section>
  {{ else }}
    <!-- Nested section pages (e.g., /tutorials/docker/) wider -->
    <section class="section">
      <div class="container">
        <div class="prose md:prose-lg dark:prose-invert max-w-none">
          {{ .Content }}
        </div>
      </div>
    </section>
  {{ end }}

  <!-- Grid of child sections with equal height cards -->
  <section class="section">
    <div class="container">
      <ul class="card-grid">
        {{ range .Sections }}
          <li class="h-full">
            <a href="{{ .RelPermalink }}" class="card h-full flex flex-col">
              <div class="flex-grow">
                <h3 class="text-xl font-semibold mb-2">{{ .Title }}</h3>
                {{ with .Params.description }}
                  <p class="text-sm opacity-75 mb-2">{{ . }}</p>
                {{ end }}
              </div>
              <div class="mt-4 pt-4 border-t border-gray-700">
                <span class="read-more">
                  Read More <span class="arrow">→</span>
                </span>
              </div>
            </a>
          </li>
        {{ end }}
      </ul>
    </div>
  </section>
{{ end }}
