{{ $type := .Get 0 | default "info" }}
{{ $iconMap := dict
  "info" "ℹ️"
  "tip" "💡"
  "warning" "⚠️"
  "danger" "🚨"
  "success" "✅"
  "note" "📝"
  "important" "🔔"
}}

{{ $icon := index $iconMap $type | default "ℹ️" }}
{{ $class := printf "notice notice-%s" $type }}

<div class="{{ $class }}">
  <div class="notice-icon">{{ $icon }}</div>
  <div class="notice-content">
    {{ .Inner | markdownify }}
  </div>
</div>

<style>
.notice {
  position: relative;
  padding: 1rem 1.25rem 1rem 3.5rem;
  margin: 1.5rem 0;
  border-radius: 6px;
  border-left: 4px solid;
  background: #1e2b3c !important;
  color: #e0e0e0 !important;
  font-size: 0.95rem;
  line-height: 1.6;
}

.notice-icon {
  position: absolute;
  left: 1rem;
  top: 1rem;
  font-size: 1.25rem;
  line-height: 1;
}

.notice-content {
  margin-left: 0.5rem;
}

.notice-content > :first-child {
  margin-top: 0;
}

.notice-content > :last-child {
  margin-bottom: 0;
}

/* Notice Types */
.notice-info {
  border-color: #4fc3f7 !important;
  background-color: #1e2b3c !important;
}

.notice-tip {
  border-color: #4caf50 !important;
  background-color: #1e3a2e !important;
}

.notice-warning {
  border-color: #ff9800 !important;
  background-color: #3e2a1f !important;
}

.notice-danger {
  border-color: #f44336 !important;
  background-color: #3c1e1e !important;
}

.notice-success {
  border-color: #4caf50 !important;
  background-color: #1e3a2e !important;
}

.notice-note {
  border-color: #9f7aea !important;
  background-color: #2e1e3c !important;
}

.notice-important {
  border-color: #ff9800 !important;
  background-color: #3e2a1f !important;
}

/* Nested elements */
.notice p:first-child {
  margin-top: 0;
}

.notice p:last-child {
  margin-bottom: 0;
}

.notice a {
  color: #4fc3f7 !important;
  text-decoration: none !important;
  border-bottom: 1px solid rgba(79, 195, 247, 0.5);
  transition: all 0.2s ease;
}

.notice a:hover {
  color: #80d8ff !important;
  border-bottom-color: #80d8ff;
}

/* Responsive adjustments */
@media (max-width: 768px) {
  .notice {
    padding: 0.875rem 1rem 0.875rem 3rem;
    margin: 1.25rem 0;
  }
  
  .notice-icon {
    left: 0.75rem;
    top: 0.875rem;
  }
}
</style>
