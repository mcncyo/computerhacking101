{{ $title := .Get "title" }}
{{ $link := .Get "link" }}
{{ $icon := .Get "icon" }}
{{ $text := .Get "text" }}

<div class="card">
  <div class="card-body">
    <h3 class="card-title">
      {{ with $icon }}<i class="fas fa-{{ . }}"></i>{{ end }}
      {{ $title }}
    </h3>
    <p class="card-text">{{ $text | markdownify }}</p>
    {{ with $link }}
    <div class="card-footer">
      <a href="{{ . }}" class="btn">Learn More</a>
    </div>
    {{ end }}
  </div>
</div>
