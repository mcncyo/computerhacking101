<div class="columns-container">
  <div class="columns-inner">
    {{ .Inner | safeHTML }}
  </div>
</div>

<style>
.columns-container {
  width: 100%;
  margin: 2rem 0;
}

.columns-inner {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1.5rem;
}

/* Responsive adjustments */
@media (max-width: 768px) {
  .columns-inner {
    grid-template-columns: 1fr;
  }
}
</style>
