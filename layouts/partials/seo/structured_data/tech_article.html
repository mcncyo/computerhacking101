{{- if .IsPage -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "TechArticle",
  "headline": "{{ .Title }}",
  "description": "{{ .Description | default .Summary | plainify | safeHTML }}",
  "datePublished": "{{ .PublishDate.Format "2006-01-02T15:04:05Z07:00" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
  "author": [{
    "@type": "Person",
    "name": "{{ .Params.author | default .Site.Author.name }}"
  }],
  "publisher": {
    "@type": "Organization",
    "name": "{{ .Site.Title }}",
    "logo": {
      "@type": "ImageObject",
      "url": "{{ "images/logo.png" | absURL }}"
    }
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ .Permalink }}"
  },
  "url": "{{ .Permalink }}",
  "image": {
    "@type": "ImageObject",
    "url": "{{ .Params.image | default .Site.Params.defaultImage | absURL }}",
    "width": 1200,
    "height": 630
  },
  "keywords": "{{ with .Params.tags }}{{ delimit . ", " }}{{ end }}"
}
</script>
{{- end -}}
