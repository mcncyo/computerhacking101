kind: pipeline
type: docker
name: Deploy Hugo site (Cloudflare Pages)

clone:
  depth: 0

steps:
  # ----------------- BUILD -----------------
  - name: build-hugo
    image: hugomods/hugo:exts
    environment:
      HUGO_ENV: production
      HUGO_MODULE_PROXY: "off"       # use vendored modules
      HUGO_MODULE_OFFLINE: "true"    # use vendored modules
      TZ: America/Chicago
    commands:
      - set -eux
      - npm ci || npm install
      - export PATH="$PATH:$(pwd)/node_modules/.bin"
      # Build with all content included
      - hugo --minify --gc --enableGitInfo --environment production --cleanDestinationDir --ignoreCache --buildDrafts=false --buildFuture=false --buildExpired=false --baseURL "https://computerhacking101.com/"

  # ----------------- VERIFY SITEMAP (pre-deploy) -----------------
  - name: verify-sitemap
    image: alpine:3.20
    when:
      event: [ push, tag ]
    commands:
      - set -euxo pipefail
      - test -f public/sitemap.xml
      - echo "Sitemap file exists:" && ls -lh public/sitemap.xml
      - echo "Total <url> entries:" && grep -c "<url>" public/sitemap.xml || true
      - echo "Tutorial URLs present (showing up to 20):" && grep -n "/tutorials/" public/sitemap.xml | head -n 20 || true
      - echo "First 80 lines of sitemap.xml:" && sed -n '1,80p' public/sitemap.xml
      - |
        if [ -f public/sitemap-pages.xml ]; then
          echo "sitemap-pages.xml present:" && ls -lh public/sitemap-pages.xml;
          echo "Pages <url> count:" && grep -c "<url>" public/sitemap-pages.xml || true;
          sed -n '1,40p' public/sitemap-pages.xml;
        else
          echo "sitemap-pages.xml not found";
        fi
      - |
        if [ -f public/sitemap-posts.xml ]; then
          echo "sitemap-posts.xml present:" && ls -lh public/sitemap-posts.xml;
          echo "Posts <url> count:" && grep -c "<url>" public/sitemap-posts.xml || true;
          grep -n "/tutorials/\|/blog/" public/sitemap-posts.xml | head -n 20 || true;
        else
          echo "sitemap-posts.xml not found";
        fi

  # ----------------- DEPLOY TO CLOUDFLARE PAGES -----------------
  - name: deploy-pages
    image: node:20-alpine
    when:
      event: [ push, tag ]
    environment:
      CLOUDFLARE_ACCOUNT_ID:
        from_secret: CF_ACCOUNT_ID
      CLOUDFLARE_API_TOKEN:
        from_secret: CLOUDFLARE_API_TOKEN
    commands:
      - set -eux
      - apk add --no-cache tzdata
      - '[ -n "$CLOUDFLARE_ACCOUNT_ID" ] || ( echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1 )'
      - '[ -n "$CLOUDFLARE_API_TOKEN" ]  || ( echo "Missing CLOUDFLARE_API_TOKEN";  exit 1 )'
      - npm install -g wrangler@3
      - |
        if [ "$DRONE_BRANCH" = "main" ]; then
          wrangler pages deploy public --project-name=computerhacking101
        else
          wrangler pages deploy public --project-name=computerhacking101 --branch="$DRONE_BRANCH"
        fi

  # ----------------- PURGE CLOUDFLARE CACHE -----------------
  - name: purge-cf-cache
    image: alpine/curl:8.9.1
    when:
      event: [ push, tag ]
      branch: [ main ]
    environment:
      CLOUDFLARE_API_TOKEN:
        from_secret: CLOUDFLARE_API_TOKEN
      CF_ZONE_ID:
        from_secret: CF_ZONE_ID
    commands:
      - set -eux
      - '[ -n "$CF_ZONE_ID" ] || ( echo "Missing CF_ZONE_ID"; exit 1 )'
      - '[ -n "$CLOUDFLARE_API_TOKEN" ] || ( echo "Missing CLOUDFLARE_API_TOKEN"; exit 1 )'
      - >-
        curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
        -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
        -H "Content-Type: application/json" \
        --data '{
          "files": [
            "https://computerhacking101.com/sitemap.xml",
            "https://computerhacking101.com/sitemap-pages.xml",
            "https://computerhacking101.com/sitemap-posts.xml",
            "https://computerhacking101.com/robots.txt"
          ]
        }'
      - echo "Requested Cloudflare cache purge for sitemap and robots."

  # ----------------- INDEXNOW (always from sitemap) -----------------
  - name: indexnow-submit
    image: python:3.11-alpine
    when:
      event: [ push, tag ]
      branch: [ main ]
    environment:
      INDEXNOW_KEY:
        from_secret: INDEXNOW_KEY
    commands:
      - pip install --no-cache-dir requests defusedxml
      - chmod +x .drone/scripts/indexnow.py
      - SITE_HOST=computerhacking101.com .drone/scripts/indexnow.py

  # ----------------- WARM CACHE (optional) -----------------
  - name: warm-cache
    image: alpine/curl:8.9.1
    when:
      event: [ push, tag ]
      branch: [ main ]
    commands:
      - chmod +x .drone/scripts/warm_cache.sh
      - .drone/scripts/warm_cache.sh "https://computerhacking101.com/sitemap.xml" "https://computerhacking101.com/ https://www.computerhacking101.com/"

trigger:
  branch: [ main ]
  event: [ push, tag ]
