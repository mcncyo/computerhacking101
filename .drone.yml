kind: pipeline
type: docker
name: Deploy Hugo site (Cloudflare Pages)

clone:
  depth: 0

steps:
  # ----------------- BUILD -----------------
  - name: build-hugo
    image: hugomods/hugo:exts
    environment:
      HUGO_ENV: production
      HUGO_MODULE_PROXY: "off"       # use vendored modules
      HUGO_MODULE_OFFLINE: "true"    # use vendored modules
      TZ: America/Chicago
    commands:
      - set -eux
      - npm ci || npm install
      - export PATH="$PATH:$(pwd)/node_modules/.bin"
      - hugo --minify --gc --enableGitInfo -e production --baseURL "https://computerhacking101.com/"

  # ----------------- DEPLOY TO CLOUDFLARE PAGES -----------------
  - name: deploy-pages
    image: node:20-alpine
    when:
      event: [ push, tag ]
    environment:
      CLOUDFLARE_ACCOUNT_ID:
        from_secret: CF_ACCOUNT_ID
      CLOUDFLARE_API_TOKEN:
        from_secret: CLOUDFLARE_API_TOKEN
    commands:
      - set -eux
      - apk add --no-cache tzdata
      - '[ -n "$CLOUDFLARE_ACCOUNT_ID" ] || ( echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1 )'
      - '[ -n "$CLOUDFLARE_API_TOKEN" ]  || ( echo "Missing CLOUDFLARE_API_TOKEN";  exit 1 )'
      - npm install -g wrangler@3
      - |
        if [ "$DRONE_BRANCH" = "main" ]; then
          wrangler pages deploy public --project-name=computerhacking101
        else
          wrangler pages deploy public --project-name=computerhacking101 --branch="$DRONE_BRANCH"
        fi

  # ----------------- INDEXNOW (always from sitemap) -----------------
  - name: indexnow-submit
    image: python:3.11-alpine
    when:
      event: [ push, tag ]
      branch: [ main ]
    environment:
      INDEXNOW_KEY:
        from_secret: INDEXNOW_KEY
    commands:
      - pip install --no-cache-dir requests
      - chmod +x .drone/scripts/indexnow.py
      - SITE_HOST=computerhacking101.com .drone/scripts/indexnow.py

  # ----------------- WARM CACHE (optional) -----------------
  - name: warm-cache
    image: alpine/curl:8.9.1
    when:
      event: [ push, tag ]
      branch: [ main ]
    commands:
      - chmod +x .drone/scripts/warm_cache.sh
      - .drone/scripts/warm_cache.sh "https://computerhacking101.com/sitemap.xml" "https://computerhacking101.com/ https://www.computerhacking101.com/"

trigger:
  branch: [ main ]
  event: [ push, tag ]
