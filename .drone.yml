kind: pipeline
type: docker
name: Deploy Hugo site (latest)

clone:
  depth: 0

steps:
  - name: build-hugo
    image: hugomods/hugo:exts
    commands:
      - hugo --minify --gc --enableGitInfo

  # sanity check: prove secrets are available on push/tag
  - name: debug-secrets
    image: alpine:3.20
    when:
      event: [ push, tag ]
    environment:
      CF_API_TOKEN:
        from_secret: CF_API_TOKEN
      CF_ZONE_ID:
        from_secret: CF_ZONE_ID
      INDEXNOW_KEY:
        from_secret: INDEXNOW_KEY
      SSH_USER:
        from_secret: SSH_USER
    commands:
      - |
        echo "=== Checking required secrets ==="
        if [ -n "$CF_API_TOKEN" ]; then echo "CF_API_TOKEN is set"; else echo "CF_API_TOKEN is MISSING"; exit 1; fi
        if [ -n "$CF_ZONE_ID" ]; then echo "CF_ZONE_ID is set"; else echo "CF_ZONE_ID is MISSING"; exit 1; fi
        if [ -n "$INDEXNOW_KEY" ]; then echo "INDEXNOW_KEY is set"; else echo "INDEXNOW_KEY is MISSING"; exit 1; fi
        if [ -n "$SSH_USER" ]; then echo "SSH_USER is set"; else echo "SSH_USER is MISSING"; exit 1; fi
        echo "All required secrets are present"

  - name: deploy-rsync
    image: alpine:3.20
    when:
      event: [ push, tag ]
    environment:
      SSH_HOST:
        from_secret: SSH_HOST
      SSH_PORT:
        from_secret: SSH_PORT
      SSH_USER:
        from_secret: SSH_USER
      SSH_TARGET_DIR:
        from_secret: SSH_TARGET_DIR
      SSH_PRIVATE_KEY:
        from_secret: SSH_PRIVATE_KEY
    commands:
      - apk add --no-cache rsync openssh-client
      - mkdir -p ~/.ssh
      - printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
      - chmod 600 ~/.ssh/id_rsa
      - ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts
      - rsync -avz --delete -e "ssh -p ${SSH_PORT:-22}" ./public/ "$SSH_USER@$SSH_HOST:$SSH_TARGET_DIR"

  - name: post-deploy-hooks
    image: alpine:3.20
    when:
      event: [ push, tag ]
    environment:
      SITE_URL: https://computerhacking101.com
      CF_ZONE_ID:
        from_secret: CF_ZONE_ID
      CF_API_TOKEN:
        from_secret: CF_API_TOKEN
      INDEXNOW_KEY:
        from_secret: INDEXNOW_KEY
    commands:
      - apk add --no-cache curl
      - |
        echo "=== Starting post-deploy hooks ==="
        
        # Cloudflare cache purge
        if [ -n "$CF_ZONE_ID" ] && [ -n "$CF_API_TOKEN" ]; then
          echo "Purging Cloudflare cache..."
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            -w "\nStatus: %{http_code}\n"
        else
          echo "Cloudflare credentials missing; skipping cache purge"
        fi
        
        # IndexNow submission
        if [ -n "$INDEXNOW_KEY" ]; then
          echo "Submitting to IndexNow..."
          echo "URL: $SITE_URL"
          curl -s -w "\nStatus: %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            --data "{\"host\":\"computerhacking101.com\",\"key\":\"$INDEXNOW_KEY\",\"urlList\":[\"$SITE_URL\"]}"
        else
          echo "IndexNow key missing; skipping submission"
        fi

# Trigger pipeline on push to main branch or tags
trigger:
  branch: [ main ]
  event:  [ push, tag ]



