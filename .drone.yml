kind: pipeline
type: docker
name: build-and-deploy

steps:
  - name: git submodules
    image: alpine/git
    commands:
      - git submodule update --init --recursive

  # Build with Hugo (Alpine) and install Node/PostCSS inside the container
  - name: build site
    image: klakegg/hugo:0.128.2-ext-alpine
    environment:
      HUGO_ENV: production
      NODE_ENV: production
    commands:
      - umask 0022
      # Node & npm for PostCSS/Tailwind pipeline
      - apk add --no-cache nodejs npm
      # Install global CLIs (some Hugoplate pipelines expect these)
      - npm i -g postcss postcss-cli autoprefixer tailwindcss
      # If your repo has a package.json, install it
      - if [ -f package.json ]; then npm ci || npm i; fi
      # If the theme lives in themes/hugoplate with its own package.json, install there too
      - if [ -d themes/hugoplate ] && [ -f themes/hugoplate/package.json ]; then (cd themes/hugoplate && npm ci || npm i); fi
      # Update Hugo modules to versions your theme expects
      - hugo mod get -u
      - hugo mod tidy
      # Build
      - hugo --minify --baseURL "https://computerhacking101.com/" --gc
      - ls -lh public
      - ls -lh public/index.html || echo "index.html missing"


  # Full crawl to populate changed_urls.txt for IndexNow
  - name: extract all URLs
    image: python:3.11-alpine
    commands:
      - python .drone/scripts/extract_all_urls.py

  - name: deploy to Cloudflare Pages
    image: node:20-alpine
    environment:
      CLOUDFLARE_ACCOUNT_ID:
        from_secret: CF_ACCOUNT_ID
      CLOUDFLARE_API_TOKEN:
        from_secret: CLOUDFLARE_API_TOKEN
    commands:
      - corepack enable || true
      - '[ -n "$CLOUDFLARE_ACCOUNT_ID" ] || ( echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1 )'
      - '[ -n "$CLOUDFLARE_API_TOKEN" ]  || ( echo "Missing CLOUDFLARE_API_TOKEN" && exit 1 )'
      - >
        if [ "$DRONE_BRANCH" = "main" ]; then
          npx --yes wrangler@3 pages deploy public --project-name=computerhacking101;
        else
          npx --yes wrangler@3 pages deploy public --project-name=computerhacking101 --branch="$DRONE_BRANCH";
        fi
    when:
      branch:
        include: [ main, feature/*, fix/* ]

  - name: submit IndexNow (main only)
    image: python:3.11-alpine
    when:
      branch: [ main ]
    environment:
      INDEXNOW_KEY:
        from_secret: INDEXNOW_KEY
    commands:
      - pip install --no-cache-dir requests
      - python .drone/scripts/indexnow_submit.py computerhacking101.com "$INDEXNOW_KEY"

  - name: warm up Cloudflare cache (parallel)
    image: curlimages/curl:8.9.1
    when:
      branch: [ main ]
    commands:
      - chmod +x .drone/scripts/warm_cache.sh
      - .drone/scripts/warm_cache.sh "https://computerhacking101.com/sitemap.xml" 10

