kind: pipeline
type: docker
name: Deploy Hugo site (latest, no klakegg)

clone:
  depth: 0

steps:
  - name: build-deploy-all
    image: node:20-alpine
    environment:
      HUGO_ENV: production
      SITE_URL: https://computerhacking101.com
      CHANGE_WINDOW_HOURS: 24

      # TinaCMS (secrets)
      TINA_CLIENT_ID:
        from_secret: TINA_CLIENT_ID
      TINA_TOKEN:
        from_secret: TINA_TOKEN
      TINA_SEARCH_TOKEN:
        from_secret: TINA_SEARCH_TOKEN

      # SSH / Deploy (secrets)
      SSH_HOST:
        from_secret: SSH_HOST
      SSH_PORT:
        from_secret: SSH_PORT      # optional; default 22
      SSH_USER:
        from_secret: SSH_USER
      SSH_TARGET_DIR:
        from_secret: SSH_TARGET_DIR
      SSH_PRIVATE_KEY:
        from_secret: SSH_PRIVATE_KEY

      # Cloudflare (secrets)
      CF_ZONE_ID:
        from_secret: CF_ZONE_ID
      CF_API_TOKEN:
        from_secret: CF_API_TOKEN

      # IndexNow (secret)
      INDEXNOW_KEY:
        from_secret: INDEXNOW_KEY

      # OPTIONAL: GitHub token (raises API rate-limit)
      GITHUB_TOKEN:
        from_secret: GITHUB_TOKEN

      # --- Hugo install script (POSIX sh; resolves latest via API, no bash arrays) ---
      HUGO_INSTALL: |
        set -eu

        # 1) Detect & normalize arch
        ARCH_RAW="$(uname -m 2>/dev/null || true)"
        ARCH_LOWER="$(printf '%s' "$ARCH_RAW" | tr -d '\r' | tr '[:upper:]' '[:lower:]')"
        echo "Detected arch: $ARCH_RAW -> $ARCH_LOWER"
        case "$ARCH_LOWER" in
          x86_64|amd64)  PKG_ARCH="Linux-64bit" ;;
          aarch64|arm64) PKG_ARCH="Linux-ARM64" ;;
          *)
            echo "Unsupported arch: $ARCH_RAW" >&2
            exit 1
            ;;
        esac

        # 2) Resolve latest tag via API (with optional token), fallback to redirect
        VER=""
        if [ -n "${GITHUB_TOKEN:-}" ]; then
          VER="$(curl -fsSL \
                  -H "Accept: application/vnd.github+json" \
                  -H "User-Agent: drone-ci" \
                  -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                  https://api.github.com/repos/gohugoio/hugo/releases/latest \
                | python3 -c 'import sys,json; print(json.load(sys.stdin).get("tag_name",""))' || true)"
        else
          VER="$(curl -fsSL \
                  -H "Accept: application/vnd.github+json" \
                  -H "User-Agent: drone-ci" \
                  https://api.github.com/repos/gohugoio/hugo/releases/latest \
                | python3 -c 'import sys,json; print(json.load(sys.stdin).get("tag_name",""))' || true)"
        fi

        if [ -z "$VER" ]; then
          echo "GitHub API failed or rate-limited; using redirect fallback..."
          REDIR="$(curl -fLsS -o /dev/null -w '%{url_effective}' https://github.com/gohugoio/hugo/releases/latest || true)"
          VER="${REDIR##*/}"
        fi

        if [ -z "$VER" ]; then
          echo "Failed to resolve latest Hugo version" >&2


