
kind: pipeline
type: docker
name: Deploy Hugo site (latest, no klakegg)

clone:
  depth: 0

steps:
  - name: build-deploy-all
    image: node:20-alpine
    environment:
      HUGO_ENV: production
      SITE_URL: https://computerhacking101.com
      CHANGE_WINDOW_HOURS: 24

      # TinaCMS (secrets)
      TINA_CLIENT_ID:
        from_secret: TINA_CLIENT_ID
      TINA_TOKEN:
        from_secret: TINA_TOKEN
      TINA_SEARCH_TOKEN:
        from_secret: TINA_SEARCH_TOKEN

      # SSH / Deploy (secrets)
      SSH_HOST:
        from_secret: SSH_HOST
      SSH_PORT:
        from_secret: SSH_PORT
      SSH_USER:
        from_secret: SSH_USER
      SSH_TARGET_DIR:
        from_secret: SSH_TARGET_DIR
      SSH_PRIVATE_KEY:
        from_secret: SSH_PRIVATE_KEY

      # Cloudflare (secrets)
      CF_ZONE_ID:
        from_secret: CF_ZONE_ID
      CF_API_TOKEN:
        from_secret: CF_API_TOKEN

      # IndexNow (secret)
      INDEXNOW_KEY:
        from_secret: INDEXNOW_KEY

      # Hugo install script (resolves latest tag dynamically)
      HUGO_INSTALL: |
        set -euo pipefail

        # 1) Detect and normalize architecture
        ARCH_RAW="$(uname -m 2>/dev/null || true)"
        ARCH="$(printf '%s' "$ARCH_RAW" | tr -d '\r' | tr '[:upper:]' '[:lower:]')"
        echo "Detected arch: $ARCH_RAW -> $ARCH"

        case "$ARCH" in
          x86_64|amd64)   PKG_ARCH="Linux-64bit" ;;
          aarch64|arm64)  PKG_ARCH="Linux-ARM64" ;;
          *)
            echo "Unsupported arch: $ARCH_RAW" >&2
            exit 1
            ;;
        esac

        # 2) Resolve the latest release tag (e.g., v0.135.0)
        LATEST_TAG="$(curl -fLsS -o /dev/null -w '%{url_effective}' https://github.com/gohugoio/hugo/releases/latest)"
        VER="${LATEST_TAG##*/}"
        if [ -z "$VER" ]; then
          echo "Failed to resolve latest Hugo version" >&2
          exit 1
        fi

        # 3) Build filename and URL for Hugo Extended
        PKG="hugo_extended_${VER}_${PKG_ARCH}.tar.gz"
        URL="https://github.com/gohugoio/hugo/releases/download/${VER}/${PKG}"

        echo "Resolved latest: VER=${VER}, ARCH=${PKG_ARCH}"
        echo "Fetching ${URL} ..."
        curl -fLsS -o /tmp/hugo.tgz "$URL"

        # 4) Install hugo binary
        tar -xzf /tmp/hugo.tgz -C /usr/local/bin hugo
        chmod +x /usr/local/bin/hugo
        /usr/local/bin/hugo version

    commands:
      - apk add --no-cache curl rsync openssh python3 tar git
      - sh -ceu "$HUGO_INSTALL"

      - git submodule update --init --recursive
      - node -v && npm -v && hugo version
      - npm ci
      - npm run project-setup
      - npm run build   # emits ./public

      # Deploy via rsync over SSH
      - |
        mkdir -p ~/.ssh
        printf "%s" "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
        chmod 600 ~/.ssh/id_deploy
      - >
        rsync -az --delete
        -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no -p ${SSH_PORT:-22}"
        public/ "${SSH_USER}@${SSH_HOST}:${SSH_TARGET_DIR}"

      # Build changed URL list from sitemap (last N hours)
      - |
        python3 - <<'PY'
        import os, datetime as dt, xml.etree.ElementTree as ET, pathlib, sys
        cutoff = dt.datetime.utcnow() - dt.timedelta(hours=int(os.getenv('CHANGE_WINDOW_HOURS','24')))
        ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
        sitemap = pathlib.Path('public/sitemap.xml')
        if not sitemap.exists():
            print('WARNING: sitemap.xml not found'); sys.exit(0)
        urls = []
        for url in ET.parse(sitemap).getroot().findall('sm:url', ns):
            lm = url.find('sm:lastmod', ns)
            if lm is None: continue
            try:
                ts = dt.datetime.fromisoformat(lm.text.replace('Z','+00:00')).replace(tzinfo=None)
            except ValueError:
                continue
            if ts >= cutoff:
                loc = url.find('sm:loc', ns).text
                if loc: urls.append(loc)
        if urls:
            open('changed_urls.txt','w').write('\n'.join(urls))
        PY

      # IndexNow ping (only if URLs exist)
      - |
        if [ -s changed_urls.txt ]; then
          URLS_JSON=$(awk '{printf "\"%s\",",$0}' changed_urls.txt | sed 's/,$//')
          HOST=$(echo "$SITE_URL" | sed -E 's#^https?://##; s#/$##;')
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "{\"host\":\"${HOST}\",\"key\":\"$INDEXNOW_KEY\",\"urlList\":[${URLS_JSON}]}"
        else
          echo "No changed URLs; skipping IndexNow."
        fi

      # Cloudflare purge (only changed URLs)
      - |
        if [ -s changed_urls.txt ] && [ -n "$CF_ZONE_ID" ]; then
          FILES_JSON=$(awk '{printf "\"%s\",",$0}' changed_urls.txt | sed 's/,$//')
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"files\":[${FILES_JSON}]}"
        else
          echo "Skip Cloudflare purge (no URLs or CF zone unset)."
        fi

trigger:
  event: [ push ]
  branch: [ main ]
