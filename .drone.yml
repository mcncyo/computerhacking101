kind: pipeline
type: docker
name: build-and-deploy

steps:
  - name: git submodules
    image: alpine/git
    commands:
      - git submodule update --init --recursive

  # Build with Node and Hugo Extended (latest with fallback)
  - name: build site
    image: node:20-alpine
    environment:
      HUGO_ENV: production
      NODE_ENV: production
    commands:
      - set -eux
      - apk add --no-cache curl tar bash jq libc6-compat

      # --- choose Hugo version (latest or fallback) ---
      - HUGO_FALLBACK=0.128.2
      - HUGO_VERSION=$(curl -s https://api.github.com/repos/gohugoio/hugo/releases/latest | jq -r .tag_name | sed 's/^v//' || true)
      - |
        if [ -z "$HUGO_VERSION" ]; then
          echo "Could not get latest Hugo via GitHub API; falling back to $HUGO_FALLBACK"
          HUGO_VERSION="$HUGO_FALLBACK"
        fi

      # build URL with printf to avoid Drone parsing issues
      - HUGO_URL=$(printf 'https://github.com/gohugoio/hugo/releases/download/v%s/hugo_extended_%s_Linux-64bit.tar.gz' "$HUGO_VERSION" "$HUGO_VERSION")

      # check asset; if missing, fall back
      - |
        if ! curl -fsI "$HUGO_URL" >/dev/null 2>&1; then
          echo "Latest Hugo asset not found ($HUGO_URL); falling back to $HUGO_FALLBACK"
          HUGO_VERSION="$HUGO_FALLBACK"
          HUGO_URL=$(printf 'https://github.com/gohugoio/hugo/releases/download/v%s/hugo_extended_%s_Linux-64bit.tar.gz' "$HUGO_VERSION" "$HUGO_VERSION")
        fi

      - echo "Using Hugo Extended $HUGO_VERSION"
      - curl -fsSL -o /tmp/hugo.tar.gz "$HUGO_URL"
      - tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
      - install /tmp/hugo /usr/local/bin/hugo
      - hugo version

      # --- CSS pipeline toolchain (Hugoplate expects these) ---
      - npm i -g postcss postcss-cli autoprefixer tailwindcss

      # repo-level npm (if present)
      - if [ -f package.json ]; then npm ci || npm i; fi
      # theme-level npm (if vendored)
      - if [ -d themes/hugoplate ] && [ -f themes/hugoplate/package.json ]; then (cd themes/hugoplate && npm ci || npm i); fi

      # update modules (safe even if not using modules)
      - hugo mod get -u || true
      - hugo mod tidy || true

      # build
      - umask 0022
      - hugo --minify --gc --baseURL "https://computerhacking101.com/"
      - ls -lh public
      - ls -lh public/index.html || echo "index.html missing"

  - name: extract all URLs
    image: python:3.11-alpine
    commands:
      - python .drone/scripts/extract_all_urls.py

  - name: deploy to Cloudflare Pages
    image: node:20-alpine
    environment:
      CLOUDFLARE_ACCOUNT_ID:
        from_secret: CF_ACCOUNT_ID
      CLOUDFLARE_API_TOKEN:
        from_secret: CLOUDFLARE_API_TOKEN
    commands:
      - corepack enable || true
      - '[ -n "$CLOUDFLARE_ACCOUNT_ID" ] || ( echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1 )'
      - '[ -n "$CLOUDFLARE_API_TOKEN" ]  || ( echo "Missing CLOUDFLARE_API_TOKEN" && exit 1 )'
      - >
        if [ "$DRONE_BRANCH" = "main" ]; then
          npx --yes wrangler@3 pages deploy public --project-name=computerhacking101;
        else
          npx --yes wrangler@3 pages deploy public --project-name=computerhacking101 --branch="$DRONE_BRANCH";
        fi
    when:
      branch:
        include: [ main, feature/*, fix/* ]

  - name: submit IndexNow (main only)
    image: python:3.11-alpine
    when:
      branch: [ main ]
    environment:
      INDEXNOW_KEY:
        from_secret: INDEXNOW_KEY
    commands:
      - pip install --no-cache-dir requests
      - python .drone/scripts/indexnow_submit.py computerhacking101.com "$INDEXNOW_KEY"

  - name: warm up Cloudflare cache (parallel)
    image: curlimages/curl:8.9.1
    when:
      branch: [ main ]
    commands:
      - chmod +x .drone/scripts/warm_cache.sh
      - .drone/scripts/warm_cache.sh "https://computerhacking101.com/sitemap.xml" 10
