kind: pipeline
type: docker
name: Deploy Hugo site (latest)

clone:
  depth: 0

steps:
  - name: build-hugo
    image: hugomods/hugo:exts
    commands:
      - hugo --minify --gc --enableGitInfo

  # sanity check: prove secrets are available on push/tag
  - name: debug-secrets
    image: alpine:3.20
    when:
      event: [ push, tag ]
    environment:
      CF_API_TOKEN: { from_secret: CF_API_TOKEN }
      CF_ZONE_ID:    { from_secret: CF_ZONE_ID }
      INDEXNOW_KEY:  { from_secret: INDEXNOW_KEY }
      SSH_USER:      { from_secret: SSH_USER }
    commands:
      - apk add --no-cache bash
      - |
        for v in CF_API_TOKEN CF_ZONE_ID INDEXNOW_KEY SSH_USER; do
          if [ -n "${!v}" ]; then echo "$v=SET"; else echo "$v=MISSING" && exit 1; fi
        done

  - name: deploy-rsync
    image: alpine:3.20
    when:
      event: [ push, tag ]
    environment:
      SSH_HOST:        { from_secret: SSH_HOST }
      SSH_PORT:        { from_secret: SSH_PORT }
      SSH_USER:        { from_secret: SSH_USER }
      SSH_TARGET_DIR:  { from_secret: SSH_TARGET_DIR }
      SSH_PRIVATE_KEY: { from_secret: SSH_PRIVATE_KEY }
    commands:
      - apk add --no-cache rsync openssh-client
      - mkdir -p ~/.ssh
      - printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
      - chmod 600 ~/.ssh/id_rsa
      - ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts
      - rsync -avz --delete -e "ssh -p ${SSH_PORT:-22}" ./public/ "$SSH_USER@$SSH_HOST:$SSH_TARGET_DIR"

  - name: post-deploy-hooks
    image: alpine:3.20
    when:
      event: [ push, tag ]
    environment:
      SITE_URL:      https://computerhacking101.com
      CF_ZONE_ID:    { from_secret: CF_ZONE_ID }
      CF_API_TOKEN:  { from_secret: CF_API_TOKEN }
      INDEXNOW_KEY:  { from_secret: INDEXNOW_KEY }
    commands:
      - apk add --no-cache curl
      - |
        if [ -n "$CF_ZONE_ID" ] && [ -n "$CF_API_TOKEN" ]; then
          echo "Purging Cloudflare cache..."
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            -w "\nStatus: %{http_code}\n"
        else
          echo "Cloudflare creds missing; skipping"
        fi
      - |
        if [ -n "$INDEXNOW_KEY" ]; then
          echo "Submitting to IndexNow..."
          curl -s -w "\nStatus: %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            --data "{\"host\":\"computerhacking101.com\",\"key\":\"$INDEXNOW_KEY\",\"urlList\":[\"$SITE_URL\"]}"
        else
          echo "IndexNow key missing; skipping"
        fi

trigger:
  branch: [ main ]
  event:  [ push, tag ]



