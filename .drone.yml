kind: pipeline
type: docker
name: Deploy Hugo site (latest)

clone:
  depth: 0

steps:
  - name: build-hugo
    image: hugomods/hugo:exts
    commands:
      - hugo --minify --gc --enableGitInfo

  - name: install-deps-deploy
    image: node:20-alpine
    environment:
      HUGO_ENV: production
      SITE_URL: https://computerhacking101.com
      CHANGE_WINDOW_HOURS: 24

      # SSH / Deploy (secrets)
      SSH_HOST:
        from_secret: SSH_HOST
      SSH_PORT:
        from_secret: SSH_PORT      # optional; default 22
      SSH_USER:
        from_secret: SSH_USER
      SSH_TARGET_DIR:
        from_secret: SSH_TARGET_DIR
      SSH_PRIVATE_KEY:
        from_secret: SSH_PRIVATE_KEY

      # Cloudflare (secrets)
      CF_ZONE_ID:
        from_secret: CF_ZONE_ID
      CF_API_TOKEN:
        from_secret: CF_API_TOKEN

      # IndexNow (secret)
      INDEXNOW_KEY:
        from_secret: INDEXNOW_KEY

      # OPTIONAL: GitHub token (raises API rate-limit)
      GITHUB_TOKEN:
        from_secret: GITHUB_TOKEN

    commands:
      - |
        # Install system dependencies
        apk add --no-cache \
          curl \
          git \
          openssh-client \
          python3 \
          py3-pip \
          rsync \
          tar \
          gzip

      - |
        # Install Node.js dependencies
        npm ci

      - |
        # Setup SSH for deployment
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts

      - |
        # Deploy to server via rsync over SSH
        rsync -avz --delete \
          -e "ssh -p ${SSH_PORT:-22}" \
          ./public/ \
          "$SSH_USER@$SSH_HOST:$SSH_TARGET_DIR"

      - |
        # Purge Cloudflare cache
        if [ -n "${CF_ZONE_ID:-}" ] && [ -n "${CF_API_TOKEN:-}" ]; then
          echo "Purging Cloudflare cache..."
          curl -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
        else
          echo "Cloudflare credentials not provided, skipping cache purge"
        fi

      - |
        # Submit to IndexNow
        if [ -n "${INDEXNOW_KEY:-}" ]; then
          echo "Submitting to IndexNow..."
          curl -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            --data "{\"host\":\"computerhacking101.com\",\"key\":\"$INDEXNOW_KEY\",\"urlList\":[\"$SITE_URL\"]}"
        else
          echo "IndexNow key not provided, skipping submission"
        fi

trigger:
  branch:
    - main
  event:
    - push


