kind: pipeline
type: docker
name: build-and-deploy

steps:
  - name: git submodules
    image: alpine/git
    commands:
      - git submodule update --init --recursive

  # Build with Node and Hugo Extended
  - name: build site
    image: node:20-alpine
    environment:
      HUGO_ENV: production
      NODE_ENV: production
      TZ: "America/Chicago"
    commands:
      - set -eux
      - apk add --no-cache curl tar bash jq libc6-compat tzdata git

      # --- Install Hugo Extended ---
      - wget -O /tmp/hugo.tar.gz https://github.com/gohugoio/hugo/releases/download/v0.128.2/hugo_extended_0.128.2_Linux-64bit.tar.gz
      - tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
      - install /tmp/hugo /usr/local/bin/hugo
      - hugo version

      # --- Install Node.js and dependencies ---
      - npm install -g npm@latest
      - npm ci || npm install
      
      # --- Build the site ---
      - echo "Building site with Hugo..."
      - umask 0022
      - hugo mod get github.com/hugomods/tailwindcss
      - hugo --minify --gc --baseURL "https://computerhacking101.com/" --environment production
      
      # Verify build
      - ls -lah public/
      - |
        if [ ! -f public/index.html ]; then 
          echo "Error: index.html not found"
          exit 1
        fi

  - name: extract all URLs
    image: python:3.11-alpine
    commands:
      - python .drone/scripts/extract_all_urls.py

  - name: deploy to Cloudflare Pages
    image: node:20-alpine
    environment:
      CLOUDFLARE_ACCOUNT_ID:
        from_secret: CF_ACCOUNT_ID
      CLOUDFLARE_API_TOKEN:
        from_secret: CLOUDFLARE_API_TOKEN
    commands:
      - corepack enable || true
      - '[ -n "$CLOUDFLARE_ACCOUNT_ID" ] || ( echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1 )'
      - '[ -n "$CLOUDFLARE_API_TOKEN" ]  || ( echo "Missing CLOUDFLARE_API_TOKEN" && exit 1 )'
      - >
        if [ "$DRONE_BRANCH" = "main" ]; then
          npx --yes wrangler@3 pages deploy public --project-name=computerhacking101;
        else
          npx --yes wrangler@3 pages deploy public --project-name=computerhacking101 --branch="$DRONE_BRANCH";
        fi
    when:
      branch:
        include: [ main, feature/*, fix/* ]

  - name: submit IndexNow (main only)
    image: python:3.11-alpine
    when:
      branch: [ main ]
    environment:
      INDEXNOW_KEY:
        from_secret: INDEXNOW_KEY
    commands:
      - pip install --no-cache-dir requests
      - python .drone/scripts/indexnow_submit.py computerhacking101.com "$INDEXNOW_KEY"

  - name: warm up Cloudflare cache (parallel)
    image: curlimages/curl:8.9.1
    when:
      branch: [ main ]
    commands:
      - chmod +x .drone/scripts/warm_cache.sh
      - .drone/scripts/warm_cache.sh "https://computerhacking101.com/sitemap.xml" 10
