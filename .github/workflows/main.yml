# workflow for building and deploying to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Default to bash
defaults:
  run:
    shell: bash

# Environment variables available to all jobs and steps in this workflow
env:
  HUGO_ENV: production
  HUGO_VERSION: "0.147.3"
  GO_VERSION: "1.23.3"
  TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
  TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
  TINA_SEARCH_TOKEN: ${{ secrets.TINA_SEARCH_TOKEN }}

jobs:
  # Build job
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Install Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-arm64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Install Go
        run: |
          wget -O ${{ runner.temp }}/go.deb https://dl.google.com/go/go${GO_VERSION}.linux-amd64.tar.gz \
          && sudo tar -C /usr/local -xzf ${{ runner.temp }}/go.deb

      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Project
        run: npm run project-setup

      - name: Install npm dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: ./public

   # ─────── Deploy (rsync over SSH) ───────
      - name: Deploy with rsync (clean & sync)
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avz --delete
          path: public/
          remote_path: ${{ secrets.SSH_TARGET_DIR }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key:  ${{ secrets.SSH_PRIVATE_KEY }}
          # remote_port: ${{ secrets.SSH_PORT }}   # uncomment if non-default

      # ─────── Build list of pages changed in the last N hours ───────
      - id: urls
        name: Extract changed URLs from sitemap
        run: |
          python <<'PY'
          import os, datetime as dt, xml.etree.ElementTree as ET, pathlib, sys
          cutoff = dt.datetime.utcnow() - dt.timedelta(hours=int(os.getenv('CHANGE_WINDOW_HOURS', '24')))
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          sitemap = pathlib.Path('public/sitemap.xml')
          if not sitemap.exists():
              print('::warning ::sitemap.xml not found')
              sys.exit(0)
          urls = []
          for url in ET.parse(sitemap).getroot().findall('sm:url', ns):
              loc = url.find('sm:loc', ns).text
              lm  = url.find('sm:lastmod', ns)
              if lm is None:
                  continue
              try:
                  ts = dt.datetime.fromisoformat(lm.text.replace('Z', '+00:00')).replace(tzinfo=None)
              except ValueError:
                  continue
              if ts >= cutoff:
                  urls.append(loc)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fp:
              fp.write('list<<EOF\n' + '\n'.join(urls) + '\nEOF\n')
          PY

      - name: Show changed URL list
        if: steps.urls.outputs.list != ''
        run: echo -e "::notice title=Changed URLs::\n${{ steps.urls.outputs.list }}"

      # ─────── Submit sitemap to IndexNow ───────
      - name: Submit sitemap to IndexNow
        uses: bojieyang/indexnow-action@v2
        with:
          sitemap-location: "${{ env.SITE_URL }}/sitemap.xml"
          key: 698315cd30ea01a91a97ccd265d500ca
          key-location: "https://computerhacking101.com/.well-known/indexnow.txt"
          endpoint: "api.indexnow.org"        # multi-engine endpoint
          since: 1                            # submit URLs last-modified within 1 day
          since-unit: "day"
          failure-strategy: error

      # ─────── Purge Cloudflare cache (changed URLs only) ───────
      - name: Purge Cloudflare cache (changed URLs only)
        if: ${{ steps.urls.outputs.list != '' && env.CF_ZONE_ID != '' }}
        uses: fishmanlabs/cloudflare-purge-cache-action@v1
        with:
          zone_id:   ${{ env.CF_ZONE_ID }}
          api_token: ${{ secrets.CF_API_TOKEN }}
          purge_everything: false
          purge_files: ${{ steps.urls.outputs.list }}


