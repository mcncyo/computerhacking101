name: Deploy Hugo site to server1

on:
  push:
    branches: [main]

# We only need read access to contents for checkout
permissions:
  contents: read

defaults:
  run:
    shell: bash
env:
  # ─── Build tool versions ───
  HUGO_VERSION: "0.124.2"   # latest extended release, 2025-07-04
  GO_VERSION:   "1.22.4"
  NODE_VERSION: "20"
  HUGO_ENV: production

  # ─── Workflow params ───
  SITE_URL: https://computerhacking101.com
  CHANGE_WINDOW_HOURS: 24

  # ─── TinaCMS headless credentials ───
  TINA_CLIENT_ID:     ${{ secrets.TINA_CLIENT_ID }}
  TINA_TOKEN:         ${{ secrets.TINA_TOKEN }}
  TINA_SEARCH_TOKEN:  ${{ secrets.TINA_SEARCH_TOKEN }}

  # ─── Cloudflare ───
  CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest    # change to a self-hosted label if you need ARM
    steps:
      # 1. Checkout repo with submodules (Hugoplate theme, etc.)
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
# ── Go toolchain ───────────────────────────────
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

# ── Hugo ───────────────────────────────────────
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

# ── Node ───────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}



      # 3. Any project-specific prep
      - name: Setup project (Tina schema gen, etc.)
        run: npm run project-setup

      # 4. Install deps & build
      - run: npm ci
      - run: npm run build           # emits ./public

      # 5. Rsync deploy to your VPS / bare-metal box
      - name: Deploy with rsync (clean & sync)
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avz --delete
          path: public/
          remote_path: ${{ secrets.SSH_TARGET_DIR }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key:  ${{ secrets.SSH_PRIVATE_KEY }}
          # remote_port: ${{ secrets.SSH_PORT }}   # uncomment if non-22

      # 6. Build list of URLs changed in last N hours
      - id: urls
        name: Extract changed URLs from sitemap
        run: |
          python <<'PY'
          import os, datetime as dt, xml.etree.ElementTree as ET, pathlib, sys
          cutoff = dt.datetime.utcnow() - dt.timedelta(hours=int(os.getenv('CHANGE_WINDOW_HOURS', '24')))
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          sitemap = pathlib.Path('public/sitemap.xml')
          if not sitemap.exists():
              print('::warning ::sitemap.xml not found'); sys.exit(0)
          urls = []
          for url in ET.parse(sitemap).getroot().findall('sm:url', ns):
              lm = url.find('sm:lastmod', ns)
              if lm is None: continue
              try:
                  ts = dt.datetime.fromisoformat(lm.text.replace('Z', '+00:00')).replace(tzinfo=None)
              except ValueError: continue
              if ts >= cutoff:
                  urls.append(url.find('sm:loc', ns).text)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('list<<EOF\n' + '\n'.join(urls) + '\nEOF\n')
          PY

      - name: Show changed URL list
        if: steps.urls.outputs.list != ''
        run: echo -e "::notice title=Changed URLs::\n${{ steps.urls.outputs.list }}"

      # 7. IndexNow ping
      - name: Submit sitemap to IndexNow
        uses: bojieyang/indexnow-action@v2
        with:
          sitemap-location: "${{ env.SITE_URL }}/sitemap.xml"
          key:           ${{ secrets.INDEXNOW_KEY }}
          key-location:  "${{ env.SITE_URL }}/.well-known/indexnow.txt"
          endpoint:      api.indexnow.org
          since: 1
          since-unit: day
          failure-strategy: error

      # 8. Cloudflare cache purge (only changed URLs)
      - name: Purge Cloudflare cache
        if: ${{ steps.urls.outputs.list != '' && env.CF_ZONE_ID != '' }}
        uses: fishmanlabs/cloudflare-purge-cache-action@v1
        with:
          zone_id:   ${{ env.CF_ZONE_ID }}
          api_token: ${{ secrets.CF_API_TOKEN }}
          purge_everything: false
          purge_files: ${{ steps.urls.outputs.list }}



